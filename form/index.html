<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LABITCONF 2026 — Inscripción de Speakers</title>
<style>
:root {
  --bg: #000000;
  --bg2: #0f0f0f;
  --bg3: #1a1a1a;
  --border: #2d2d2d;
  --text: #ffffff;
  --dim: #888888;
  --orange: #f7931a;
  --orange-dim: rgba(247,147,26,.15);
  --red: #dc2626;
  --green: #22c55e;
  --error: #ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;min-height:100vh;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;}
.header-logo{font-weight:900;font-size:22px;color:var(--text);letter-spacing:-.5px;}
.header-logo span{color:var(--orange);}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.lang-btn{padding:5px 14px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;background:var(--bg3);color:var(--dim);}
.lang-btn.active{background:var(--orange);color:#000;}

/* MAIN */
.main{max-width:760px;margin:0 auto;padding:32px 20px 60px;}
.page-title{font-size:26px;font-weight:900;margin-bottom:6px;color:var(--text);}
.page-sub{font-size:15px;color:var(--dim);margin-bottom:32px;}

/* SECTION */
.section{margin-bottom:28px;}
.section-title{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid var(--border);}

/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-1{display:grid;grid-template-columns:1fr;gap:14px;}
@media(max-width:560px){.grid-2{grid-template-columns:1fr;}}

/* FIELD */
.field{display:flex;flex-direction:column;gap:5px;}
.label{font-size:13px;font-weight:700;color:var(--dim);}
.label .req{color:var(--orange);}
.inp,.sel,.ta{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:15px;font-family:inherit;width:100%;outline:none;transition:border-color .15s;}
.inp::placeholder,.ta::placeholder{color:#444;}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--orange);}
.sel{cursor:pointer;color-scheme:dark;}
.sel option{background:#1a1a1a;}
.ta{resize:vertical;min-height:72px;}
.counter{font-size:12px;color:#444;text-align:right;margin-top:2px;}
.field-error .inp,.field-error .sel,.field-error .ta{border-color:var(--error);}
.field-error .label{color:var(--error);}
.err-msg{font-size:12px;color:var(--error);margin-top:2px;}

/* TEMA CARD */
.tema-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px;position:relative;}
.tema-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.tema-num{font-size:13px;font-weight:800;color:var(--orange);}
.tema-remove{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1;}
.tema-remove:hover{color:var(--error);background:rgba(239,68,68,.1);}
.add-tema-btn{display:flex;align-items:center;gap:8px;width:100%;padding:12px;border:1px dashed var(--border);border-radius:8px;background:none;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;}
.add-tema-btn:hover{color:var(--orange);border-color:var(--orange);background:var(--orange-dim);}

/* SUBMIT */
.submit-btn{width:100%;padding:14px;background:var(--orange);color:#000;border:none;border-radius:10px;font-size:16px;font-weight:900;cursor:pointer;transition:all .15s;margin-top:8px;}
.submit-btn:hover:not(:disabled){background:#ff9f1a;transform:translateY(-1px);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* SUCCESS */
.success-screen{text-align:center;padding:60px 20px;display:none;}
.success-icon{font-size:56px;margin-bottom:18px;}
.success-title{font-size:24px;font-weight:900;color:var(--green);margin-bottom:10px;}
.success-sub{font-size:15px;color:var(--dim);line-height:1.6;}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--error);color:var(--error);padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999;}
#toast.show{opacity:1;}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">LABITCONF <span>'26</span></div>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnES" onclick="setLang('es')">ES</button>
    <button class="lang-btn" id="btnEN" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="main">
  <!-- SUCCESS SCREEN -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon">₿</div>
    <div class="success-title" id="successTitle">¡Gracias por inscribirte!</div>
    <div class="success-sub" id="successSub">Revisaremos tu propuesta y te contactaremos pronto.<br><br>LABITCONF 2026 — Oct 29 · 30 · 31 · Nov 1</div>
  </div>

  <!-- FORM -->
  <div id="formWrap">
    <div class="page-title" id="pageTitle">Inscripción de Speakers</div>
    <div class="page-sub" id="pageSub">Completá el formulario para proponer tu participación en LABITCONF 2026.</div>

    <form id="speakerForm" onsubmit="handleSubmit(event)" novalidate>

      <!-- DATOS PERSONALES -->
      <div class="section">
        <div class="section-title" id="sec1Title">Datos Personales</div>
        <div class="grid-2">
          <div class="field" id="f-nombre">
            <label class="label" id="l-nombre">Nombre completo <span class="req">*</span></label>
            <input class="inp" id="nombre" type="text" autocomplete="name" maxlength="120">
          </div>
          <div class="field" id="f-apodo">
            <label class="label" id="l-apodo">Apodo / Nombre artístico</label>
            <input class="inp" id="apodo" type="text" maxlength="80">
          </div>
          <div class="field" id="f-tipo">
            <label class="label" id="l-tipo">Tipo <span class="req">*</span></label>
            <select class="sel" id="tipo">
              <option value="">—</option>
              <option value="speaker">Speaker</option>
              <option value="moderador">Moderador</option>
              <option value="panelista">Panelista</option>
              <option value="empresa">Empresa</option>
              <option value="sponsor">Sponsor</option>
            </select>
          </div>
          <div class="field" id="f-pais">
            <label class="label" id="l-pais">País de origen <span class="req">*</span></label>
            <input class="inp" id="pais" type="text" maxlength="60">
          </div>
          <div class="field" id="f-idioma">
            <label class="label" id="l-idioma">Idioma de presentación <span class="req">*</span></label>
            <select class="sel" id="idioma">
              <option value="es">Español</option>
              <option value="en">English</option>
            </select>
          </div>
          <div class="field" id="f-mail">
            <label class="label" id="l-mail">Mail <span class="req">*</span></label>
            <input class="inp" id="mail" type="email" autocomplete="email" maxlength="120">
          </div>
        </div>
      </div>

      <!-- CONTACTO -->
      <div class="section">
        <div class="section-title" id="sec2Title">Contacto</div>
        <div class="grid-2">
          <div class="field">
            <label class="label" id="l-whatsapp">WhatsApp</label>
            <input class="inp" id="whatsapp" type="tel" placeholder="+54 11 1234-5678">
          </div>
          <div class="field">
            <label class="label">Telegram</label>
            <input class="inp" id="telegram" type="text" placeholder="@usuario">
          </div>
          <div class="field">
            <label class="label">Signal</label>
            <input class="inp" id="signal" type="tel" placeholder="+54 11 1234-5678">
          </div>
          <div class="field">
            <label class="label">LinkedIn</label>
            <input class="inp" id="linkedin" type="url" placeholder="linkedin.com/in/usuario">
          </div>
          <div class="field">
            <label class="label">X / Twitter</label>
            <input class="inp" id="x" type="text" placeholder="@handle">
          </div>
          <div class="field">
            <label class="label">Instagram</label>
            <input class="inp" id="instagram" type="text" placeholder="@handle">
          </div>
          <div class="field" style="grid-column:1/-1" id="f-empresa">
            <label class="label" id="l-empresa">Empresa / Referencia</label>
            <input class="inp" id="empresa" type="text" maxlength="120">
          </div>
        </div>
      </div>

      <!-- PROPUESTA(S) -->
      <div class="section">
        <div class="section-title" id="sec3Title">Propuesta(s)</div>
        <div id="temasWrap"></div>
        <button type="button" class="add-tema-btn" id="addTemaBtn" onclick="addTema()">
          <span>+</span> <span id="addTemaLabel">Agregar otro tema</span>
        </button>
      </div>

      <!-- PERFIL -->
      <div class="section">
        <div class="section-title" id="sec4Title">Perfil</div>
        <div class="grid-1">
          <div class="field">
            <label class="label" id="l-bio">Biografía corta</label>
            <textarea class="ta" id="bio" maxlength="200" oninput="updateCounter('bio','bio-cnt',200)"></textarea>
            <div class="counter"><span id="bio-cnt">0</span>/200</div>
          </div>
          <div class="field">
            <label class="label" id="l-eventos">Eventos anteriores</label>
            <textarea class="ta" id="eventos" maxlength="400" placeholder="¿En qué eventos hablaste antes?"></textarea>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span id="submitTxt">Enviar inscripción</span>
      </button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

const GAS_URL = 'https://script.google.com/macros/s/AKfycbwqQHn5o9xxS-wmMGgJews--w_1lstRRiDiBgnlicTchskyjaixflKKfb_JPayR96p3/exec';

// ── TRADUCCIONES ───────────────────────────────────────────────────
const T = {
  es: {
    pageTitle:    'Inscripción de Speakers',
    pageSub:      'Completá el formulario para proponer tu participación en LABITCONF 2026.',
    sec1:         'Datos Personales',
    sec2:         'Contacto',
    sec3:         'Propuesta(s)',
    sec4:         'Perfil',
    lNombre:      'Nombre completo',
    lApodo:       'Apodo / Nombre artístico',
    lTipo:        'Tipo',
    lPais:        'País de origen',
    lIdioma:      'Idioma de presentación',
    lMail:        'Mail',
    lWhatsapp:    'WhatsApp',
    lEmpresa:     'Empresa / Referencia',
    lBio:         'Biografía corta',
    lEventos:     'Eventos anteriores',
    temaNum:      n => `Tema ${n}`,
    temaTitle:    'Título del tema',
    temaDesc:     'Descripción / Keywords',
    temaDescHint: 'Describí brevemente tu propuesta. Las palabras clave ayudan a agrupar por temáticas.',
    addTema:      'Agregar otro tema',
    submitBtn:    'Enviar inscripción',
    sending:      'Enviando…',
    successTitle: '¡Gracias por inscribirte!',
    successSub:   'Revisaremos tu propuesta y te contactaremos pronto.\n\nLABITCONF 2026 — Oct 29 · 30 · 31 · Nov 1',
    errRequired:  'Este campo es requerido',
    errMail:      'Mail inválido',
    errTema:      'Ingresá al menos un tema',
    toastError:   'Error al enviar. Intentá de nuevo.',
    placeholderEventos: '¿En qué eventos hablaste antes?',
  },
  en: {
    pageTitle:    'Speaker Registration',
    pageSub:      'Fill in the form to propose your participation at LABITCONF 2026.',
    sec1:         'Personal Info',
    sec2:         'Contact',
    sec3:         'Proposal(s)',
    sec4:         'Profile',
    lNombre:      'Full name',
    lApodo:       'Nickname / Stage name',
    lTipo:        'Type',
    lPais:        'Country of origin',
    lIdioma:      'Presentation language',
    lMail:        'Email',
    lWhatsapp:    'WhatsApp',
    lEmpresa:     'Company / Reference',
    lBio:         'Short bio',
    lEventos:     'Previous events',
    temaNum:      n => `Topic ${n}`,
    temaTitle:    'Topic title',
    temaDesc:     'Description / Keywords',
    temaDescHint: 'Briefly describe your proposal. Keywords help group by theme.',
    addTema:      'Add another topic',
    submitBtn:    'Submit registration',
    sending:      'Sending…',
    successTitle: 'Thank you for registering!',
    successSub:   "We'll review your proposal and contact you soon.\n\nLABITCONF 2026 — Oct 29 · 30 · 31 · Nov 1",
    errRequired:  'This field is required',
    errMail:      'Invalid email',
    errTema:      'Enter at least one topic',
    toastError:   'Error sending. Please try again.',
    placeholderEventos: 'Which events have you spoken at before?',
  }
};

let lang = 'es';
let temaCount = 0;

// ── LANG ───────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.getElementById('btnES').classList.toggle('active', l === 'es');
  document.getElementById('btnEN').classList.toggle('active', l === 'en');
  document.documentElement.lang = l;
  applyTranslations();
}

function applyTranslations() {
  const t = T[lang];
  setText('pageTitle',   t.pageTitle);
  setText('pageSub',     t.pageSub);
  setText('sec1Title',   t.sec1);
  setText('sec2Title',   t.sec2);
  setText('sec3Title',   t.sec3);
  setText('sec4Title',   t.sec4);
  setText('l-nombre',    t.lNombre + ' ★');
  setText('l-apodo',     t.lApodo);
  setText('l-tipo',      t.lTipo + ' ★');
  setText('l-pais',      t.lPais + ' ★');
  setText('l-idioma',    t.lIdioma + ' ★');
  setText('l-mail',      t.lMail + ' ★');
  setText('l-whatsapp',  t.lWhatsapp);
  setText('l-empresa',   t.lEmpresa);
  setText('l-bio',       t.lBio);
  setText('l-eventos',   t.lEventos);
  setText('addTemaLabel', t.addTema);
  setText('submitTxt',   t.submitBtn);
  setText('successTitle', t.successTitle);
  const subEl = document.getElementById('successSub');
  if (subEl) subEl.innerHTML = t.successSub.replace(/\n/g, '<br>');
  setAttr('eventos', 'placeholder', t.placeholderEventos);
  // Temas
  document.querySelectorAll('.tema-card').forEach((card, i) => {
    const num = card.dataset.num;
    const lbl = card.querySelector('.tema-num');
    if (lbl) lbl.textContent = t.temaNum(num);
    const lt = card.querySelector('.tema-title-lbl');
    if (lt) lt.textContent = t.temaTitle + (i === 0 ? ' ★' : '');
    const ld = card.querySelector('.tema-desc-lbl');
    if (ld) ld.textContent = t.temaDesc + (i === 0 ? ' ★' : '');
    const ta = card.querySelector('textarea');
    if (ta) ta.placeholder = t.temaDescHint;
  });
}

function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = val.replace('★', '<span class="req">*</span>');
}
function setAttr(id, attr, val) {
  const el = document.getElementById(id);
  if (el) el.setAttribute(attr, val);
}

// ── TEMAS ──────────────────────────────────────────────────────────
function addTema(required = false) {
  if (temaCount >= 4) return;
  temaCount++;
  const n = temaCount;
  const t = T[lang];
  const isFirst = n === 1;
  const card = document.createElement('div');
  card.className = 'tema-card';
  card.dataset.num = n;
  card.innerHTML = `
    <div class="tema-card-header">
      <span class="tema-num">${t.temaNum(n)}</span>
      ${!isFirst ? `<button type="button" class="tema-remove" onclick="removeTema(this,${n})">✕</button>` : ''}
    </div>
    <div class="grid-1" style="gap:10px">
      <div class="field" id="ft-${n}">
        <label class="label tema-title-lbl">${t.temaTitle}${isFirst ? ' <span class="req">*</span>' : ''}</label>
        <input class="inp" id="tema-titulo-${n}" type="text" maxlength="80" oninput="updateCounter('tema-titulo-${n}','cnt-t${n}',80)">
        <div class="counter"><span id="cnt-t${n}">0</span>/80</div>
      </div>
      <div class="field" id="fd-${n}">
        <label class="label tema-desc-lbl">${t.temaDesc}${isFirst ? ' <span class="req">*</span>' : ''}</label>
        <textarea class="ta" id="tema-desc-${n}" maxlength="300" placeholder="${t.temaDescHint}" oninput="updateCounter('tema-desc-${n}','cnt-d${n}',300)"></textarea>
        <div class="counter"><span id="cnt-d${n}">0</span>/300</div>
      </div>
    </div>`;
  document.getElementById('temasWrap').appendChild(card);
  document.getElementById('addTemaBtn').style.display = temaCount >= 4 ? 'none' : 'flex';
}

function removeTema(btn, n) {
  const card = btn.closest('.tema-card');
  card.remove();
  temaCount--;
  // Re-numerar
  let i = 0;
  document.querySelectorAll('.tema-card').forEach(c => {
    i++;
    c.dataset.num = i;
    const lbl = c.querySelector('.tema-num');
    if (lbl) lbl.textContent = T[lang].temaNum(i);
  });
  document.getElementById('addTemaBtn').style.display = temaCount >= 4 ? 'none' : 'flex';
}

function updateCounter(inputId, cntId, max) {
  const el = document.getElementById(inputId);
  const cnt = document.getElementById(cntId);
  if (el && cnt) cnt.textContent = (el.value || el.innerText || '').length;
}

// ── VALIDACIÓN ─────────────────────────────────────────────────────
function clearErrors() {
  document.querySelectorAll('.field-error').forEach(f => f.classList.remove('field-error'));
  document.querySelectorAll('.err-msg').forEach(e => e.remove());
}

function setError(fieldId, msg) {
  const f = document.getElementById(fieldId);
  if (!f) return;
  f.classList.add('field-error');
  const existing = f.querySelector('.err-msg');
  if (!existing) {
    const span = document.createElement('span');
    span.className = 'err-msg';
    span.textContent = msg;
    f.appendChild(span);
  }
}

function validate() {
  clearErrors();
  const t = T[lang];
  let ok = true;

  const required = [
    { id: 'f-nombre', inputId: 'nombre' },
    { id: 'f-tipo',   inputId: 'tipo' },
    { id: 'f-pais',   inputId: 'pais' },
    { id: 'f-idioma', inputId: 'idioma' },
    { id: 'f-mail',   inputId: 'mail' },
  ];

  required.forEach(({ id, inputId }) => {
    const el = document.getElementById(inputId);
    if (!el || !el.value.trim()) {
      setError(id, t.errRequired);
      ok = false;
    }
  });

  // Mail format
  const mailEl = document.getElementById('mail');
  if (mailEl && mailEl.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mailEl.value.trim())) {
    setError('f-mail', t.errMail);
    ok = false;
  }

  // Al menos 1 tema con título
  const tema1 = document.getElementById('tema-titulo-1');
  if (!tema1 || !tema1.value.trim()) {
    const ft = document.getElementById('ft-1');
    if (ft) setError('ft-1', t.errTema);
    ok = false;
  }

  return ok;
}

// ── SUBMIT ─────────────────────────────────────────────────────────
async function handleSubmit(e) {
  e.preventDefault();
  if (!validate()) {
    const firstError = document.querySelector('.field-error');
    if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const btn = document.getElementById('submitBtn');
  const txt = document.getElementById('submitTxt');
  btn.disabled = true;
  txt.innerHTML = `<span class="spinner"></span>${T[lang].sending}`;

  // Recopilar temas
  const temas = [];
  document.querySelectorAll('.tema-card').forEach(card => {
    const n = card.dataset.num;
    const titulo = (document.getElementById(`tema-titulo-${n}`)?.value || '').trim();
    const descripcion = (document.getElementById(`tema-desc-${n}`)?.value || '').trim();
    if (titulo) temas.push({ titulo, descripcion });
  });

  const payload = {
    action: 'speaker_form_submit',
    data: {
      nombre:             document.getElementById('nombre').value.trim(),
      apodo:              document.getElementById('apodo').value.trim(),
      tipo:               document.getElementById('tipo').value.trim(),
      pais:               document.getElementById('pais').value.trim(),
      idioma:             document.getElementById('idioma').value.trim(),
      mail:               document.getElementById('mail').value.trim(),
      whatsapp:           document.getElementById('whatsapp').value.trim(),
      telegram:           document.getElementById('telegram').value.trim(),
      signal:             document.getElementById('signal').value.trim(),
      linkedin:           document.getElementById('linkedin').value.trim(),
      x:                  document.getElementById('x').value.trim().replace(/^@/, ''),
      instagram:          document.getElementById('instagram').value.trim().replace(/^@/, ''),
      empresa:            document.getElementById('empresa').value.trim(),
      bio:                document.getElementById('bio').value.trim(),
      eventos_anteriores: document.getElementById('eventos').value.trim(),
      temas
    }
  };

  try {
    // Apps Script no soporta CORS preflight — usamos no-cors y asumimos éxito
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    showSuccess();
  } catch (err) {
    btn.disabled = false;
    txt.textContent = T[lang].submitBtn;
    showToast(T[lang].toastError);
  }
}

function showSuccess() {
  document.getElementById('formWrap').style.display = 'none';
  const sc = document.getElementById('successScreen');
  sc.style.display = 'block';
  document.getElementById('successTitle').textContent = T[lang].successTitle;
  const subEl = document.getElementById('successSub');
  subEl.innerHTML = T[lang].successSub.replace(/\n/g, '<br>');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

// ── INIT ───────────────────────────────────────────────────────────
addTema(true); // Tema 1 obligatorio siempre visible
applyTranslations();
</script>
